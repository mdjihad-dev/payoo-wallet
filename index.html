<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payoo | Login</title>
  <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon">

  <!-- Fontawesome cdn -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

  <!-- Tailwind & Daisy Ui -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <style>
    * {
       font-family: "Outfit", sans-serif;
    }
  </style>
</head>

<body class="min-h-screen max-w-md bg-slate-50 mx-auto">
  <!-- === Login section === -->
   <section class="pt-40">
     <div class="mx-auto">
       <img src="./assets//Logo-full.png" alt="payoo Logo" class="mx-auto">
     </div>

     <div class="mt-8">
      <fieldset class="mx-auto fieldset bg-white border-base-300 rounded-box w-sm border px-5 py-8">

        <label class="ml-4 text-sm font-bold">Mobile Number</label>
        <input id="login-number" maxlength="11" value="0123456789" type="email" class="mx-auto bg-slate-50 input rounded-full" placeholder="Enter your number" />

        <br>

        <label class="ml-4 text-sm font-bold">4 Digit Pin</label>
        <input id="input-pin" maxlength="4" type="password" class="mx-auto bg-slate-50 input rounded-full" placeholder="Enter 4 Digit Pin" />

        <button id="login-btn" class="btn btn-primary mt-4 rounded-full">Login</button>
      </fieldset>
     </div>
  </section>

  

  <script src="./script/login.js"></script>
</body>
</html>
